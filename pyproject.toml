[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklayer"
version = "0.2.5"
description = "A grid autorouter for KiCad boards: reads a .kicad_pcb, lays tracks and vias, writes it back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Gaylor, Tiggy Engineering" }]
keywords = ["kicad", "pcb", "autorouter", "routing", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["numpy>=1.22"]

[project.scripts]
tracklayer = "tracklayer.cli:main"

[project.urls]
Homepage = "https://github.com/MichaelGaylor/Tracklayer"
"Tiggy Engineering" = "https://www.tiggyengineering.com"

[tool.setuptools]
packages = ["tracklayer"]
